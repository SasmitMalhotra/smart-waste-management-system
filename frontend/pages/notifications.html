<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Notifications | Smart Waste</title>
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="logo">♻</div>
        <div><h1>Smart Waste</h1><span id="portalLabel">Portal</span></div>
      </div>
      <div id="navLinks"></div>
      <div class="sidebar-footer">
        <div id="userName">—</div>
        <a href="#" onclick="Auth.logout()" style="color:#fff;text-decoration:underline">Logout</a>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <div>
          <h2>Notifications</h2>
          <div class="subtitle">Alerts about bins, collections, and complaints</div>
        </div>
        <button class="btn-outline" onclick="markAllRead()">Mark all as read</button>
      </div>

      <div class="panel">
        <div id="notifList"></div>
        <div id="emptyState" class="empty-state" style="display:none">You're all caught up.</div>
      </div>
    </main>
  </div>

  <script src="../js/api.js"></script>
  <script>
    const user = Auth.requireAuth(["Citizen", "Collector", "Admin"]);

    const NAV = {
      Citizen: [
        ["dashboard.html", "🗑 Nearby Bins"],
        ["complaints.html", "📢 My Complaints"],
        ["notifications.html", "🔔 Notifications"],
      ],
      Collector: [
        ["collector.html", "🚛 My Collections"],
        ["notifications.html", "🔔 Notifications"],
      ],
      Admin: [
        ["admin.html", "📊 Dashboard"],
        ["notifications.html", "🔔 Notifications"],
      ],
    };

    if (user) {
      document.getElementById("userName").textContent = `${user.full_name} (${user.role})`;
      document.getElementById("portalLabel").textContent = `${user.role} Portal`;
      document.getElementById("navLinks").innerHTML = NAV[user.role]
        .map(
          ([href, label]) =>
            `<a class="nav-link ${href === "notifications.html" ? "active" : ""}" href="${href}">${label}</a>`
        )
        .join("");
    }

    async function loadNotifications() {
      try {
        const notes = await apiRequest("/notifications");
        const list = document.getElementById("notifList");
        document.getElementById("emptyState").style.display = notes.length ? "none" : "block";
        list.innerHTML = notes
          .map(
            (n) => `
          <div class="panel" style="margin-bottom:10px;padding:14px 16px;${n.status === "Unread" ? "border-left:4px solid var(--green-600)" : ""}">
            <div style="display:flex;justify-content:space-between;">
              <strong>${n.title}</strong>
              <span class="badge ${n.status}">${n.status}</span>
            </div>
            <p style="margin-top:6px;color:var(--gray-700);font-size:0.9rem">${n.message}</p>
            <div style="margin-top:6px;font-size:0.78rem;color:var(--gray-400)">${formatDate(n.created_at)}</div>
          </div>`
          )
          .join("");
      } catch (err) {
        showToast(err.message);
      }
    }

    async function markAllRead() {
      try {
        await apiRequest("/notifications/read-all", { method: "PUT" });
        loadNotifications();
      } catch (err) {
        showToast(err.message);
      }
    }

    loadNotifications();
  </script>
</body>
</html>
